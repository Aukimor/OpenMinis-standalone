name: Build and Release Android App

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '1.*'
  # 只构建、不发布：下方「Publish to GitHub Releases」的条件不含 pull_request，PR 上不会发 Release。
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/*
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Setup Android SDK and NDK r28
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKMANAGER (SDK_ROOT=$SDK_ROOT)"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;28.0.12433566" \
            "cmake;3.22.1"
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/28.0.12433566" >> $GITHUB_ENV
          echo "$SDK_ROOT/cmake/3.22.1/bin" >> $GITHUB_PATH
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Restore native dependencies cache
        id: cache-native-deps
        uses: actions/cache/restore@v4
        with:
          path: |
            src/android/app/src/main/assets/proot-aarch64
            src/android/app/src/main/assets/alpine-minirootfs.tar.gz
            src/android/app/src/main/jniLibs/arm64-v8a/libproot.so
            src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so
            src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader32.so
            src/android/app/libs/rclone.aar
          key: native-deps-android-${{ hashFiles('deps/build_proot.sh', 'deps/proot/**', 'deps/talloc/**', 'scripts/prepare_android_sandbox.sh', 'deps/build_rclone_android.sh', 'deps/rclone-mobile/**') }}
          restore-keys: |
            native-deps-android-

      - name: Build native dependencies (proot + alpine rootfs + rclone.aar)
        if: steps.cache-native-deps.outputs.cache-matched-key == ''
        run: |
          chmod +x ./deps/build_proot.sh ./scripts/prepare_android_sandbox.sh ./deps/build_rclone_android.sh
          ./deps/build_proot.sh
          ./scripts/prepare_android_sandbox.sh
          go install golang.org/x/mobile/cmd/gomobile@latest
          "$(go env GOPATH)/bin/gomobile" init
          PATH="$(go env GOPATH)/bin:$PATH" ./deps/build_rclone_android.sh
          mkdir -p src/android/app/libs
          cp deps/build/rclone/rclone.aar src/android/app/libs/

      - name: Save native dependencies cache
        if: steps.cache-native-deps.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: |
            src/android/app/src/main/assets/proot-aarch64
            src/android/app/src/main/assets/alpine-minirootfs.tar.gz
            src/android/app/src/main/jniLibs/arm64-v8a/libproot.so
            src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader.so
            src/android/app/src/main/jniLibs/arm64-v8a/libproot-loader32.so
            src/android/app/libs/rclone.aar
          key: native-deps-android-${{ hashFiles('deps/build_proot.sh', 'deps/proot/**', 'deps/talloc/**', 'scripts/prepare_android_sandbox.sh', 'deps/build_rclone_android.sh', 'deps/rclone-mobile/**') }}

      - name: Prepare build configuration
        run: |
          if [ ! -f src/android/app/provider-customization.properties ]; then
            cp src/android/app/provider-customization.properties.example src/android/app/provider-customization.properties
          fi

      - name: Build APKs with Gradle
        run: |
          cd src/android
          chmod +x gradlew
          ./gradlew :app:assembleGithubDebug --no-daemon --max-workers=2
          ./gradlew :app:assembleGithubRelease --no-daemon --max-workers=2

      - name: Unit tests (PR only)
        if: github.event_name == 'pull_request'
        run: |
          cd src/android
          ./gradlew :app:testGithubDebugUnitTest --no-daemon --max-workers=2

      - name: Rename, verify signature, and prepare APK artifacts
        run: |
          mkdir -p release-apks
          RELEASE_APK="src/android/app/build/outputs/apk/github/release/app-github-release.apk"
          DEBUG_APK="src/android/app/build/outputs/apk/github/debug/app-github-debug.apk"

          if [ ! -f "$RELEASE_APK" ]; then
            RELEASE_APK="src/android/app/build/outputs/apk/release/app-release.apk"
          fi
          if [ ! -f "$DEBUG_APK" ]; then
            DEBUG_APK="src/android/app/build/outputs/apk/debug/app-debug.apk"
          fi

          cp "$RELEASE_APK" release-apks/MinisApp-1.16.6-build47-arm64-v8a.apk
          cp "$DEBUG_APK" release-apks/MinisApp-1.16.6-build47-arm64-v8a-debug.apk

          echo "Verifying APK v2/v3 signature matches repository minis-signing.keystore..."
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --print-certs release-apks/MinisApp-1.16.6-build47-arm64-v8a.apk
          "$APKSIGNER" verify --print-certs release-apks/MinisApp-1.16.6-build47-arm64-v8a.apk | grep -i "edbe53ce109c05254678eb17093f919ebe19b2697b60251b1d3aa2415882f057"
          ls -lh release-apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openminis-apks
          path: release-apks/*.apk
          retention-days: 14

      - name: Publish to GitHub Releases
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '1.16.6' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Release 1.16.6 (build 47)' }}
          draft: false
          prerelease: false
          files: |
            release-apks/MinisApp-1.16.6-build47-arm64-v8a.apk
            release-apks/MinisApp-1.16.6-build47-arm64-v8a-debug.apk
